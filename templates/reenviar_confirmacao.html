<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenviar Confirmação - Venda Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071B13, #00A86B);
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #071B13;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00A86B;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #008f5a;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #00A86B;
            font-weight: bold;
            text-decoration: none;
        }

        .form-message {
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .form-message.error {
            background: #ffe6e6;
            color: #921f1f;
            border: 1px solid #e09b9b;
        }

        .form-message.success {
            background: #e8f8f0;
            color: #155a3b;
            border: 1px solid #a0d3be;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Reenviar confirmação</h1>
        <p class="subtitle">Digite seu e-mail para receber um novo link de confirmação.</p>

        {% if error %}
            <p class="form-message error">{{ error }}</p>
        {% endif %}
        {% if message %}
            <p class="form-message success">{{ message }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('reenviar_confirmacao') }}">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                value="{{ email|default('') }}"
                required
            >
            <button type="submit">REENVIAR CONFIRMAÇÃO</button>
        </form>

        <p class="login">
            Já recebeu o e-mail?
            <a href="{{ url_for('login') }}">Entrar</a>
        </p>
    </div>
</body>
</html>
