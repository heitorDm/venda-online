<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Venda Online</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071B13, #00A86B);
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #071B13;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00A86B;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #008f5a;
        }

        button:disabled {
            background: #7fbda6;
            cursor: not-allowed;
        }

        .cadastro {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .cadastro a {
            color: #00A86B;
            font-weight: bold;
            text-decoration: none;
        }

        .form-message {
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .form-message.error {
            background: #ffe6e6;
            color: #921f1f;
            border: 1px solid #e09b9b;
        }

        .form-message.success {
            background: #e8f8f0;
            color: #155a3b;
            border: 1px solid #a0d3be;
        }

        .form-message.info {
            background: #eef7ff;
            color: #1f4f7a;
            border: 1px solid #a7c6e7;
        }

        .resend {
            text-align: center;
            margin-top: 15px;
        }

        .resend button {
            background: transparent;
            color: #00A86B;
            padding: 5px;
            font-size: 14px;
        }

        .resend button:hover {
            background: transparent;
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Entrar</h1>

        <p class="subtitle">
            Entre na sua conta
        </p>


        <div
            id="mensagem"
            class="form-message"
            style="display: none;"
        ></div>


        <form id="loginForm">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >


            <button
                type="submit"
                id="botaoLogin"
            >
                ENTRAR
            </button>

        </form>


        <div
            id="reenviarArea"
            class="resend"
            style="display: none;"
        >

            <button
                type="button"
                id="botaoReenviar"
            >
                Reenviar e-mail de confirmação
            </button>

        </div>


        <p class="cadastro">

            Ainda não tem uma conta?

            <a href="{{ url_for('cadastro') }}">
                Criar conta
            </a>

        </p>

    </div>


    <script type="module">

        // ==========================================
        // FIREBASE
        // ==========================================

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            sendEmailVerification,
            signOut,
            reload
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        // ==========================================
        // CONFIGURAÇÃO
        // ==========================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyDmb8peQAaMeQQCyp0vH4yJau64DIsBEB0",

            authDomain:
                "vendas-online-e98a2.firebaseapp.com",

            projectId:
                "vendas-online-e98a2",

            storageBucket:
                "vendas-online-e98a2.firebasestorage.app",

            messagingSenderId:
                "521120362757",

            appId:
                "1:521120362757:web:465a844e74c9050327476c",

            measurementId:
                "G-JYVSRFBY8Y"
        };


        // ==========================================
        // INICIALIZA FIREBASE
        // ==========================================

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const formulario =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const senhaInput =
            document.getElementById("senha");

        const botaoLogin =
            document.getElementById("botaoLogin");

        const mensagem =
            document.getElementById("mensagem");

        const reenviarArea =
            document.getElementById("reenviarArea");

        const botaoReenviar =
            document.getElementById("botaoReenviar");


        // ==========================================
        // MOSTRAR MENSAGEM
        // ==========================================

        function mostrarMensagem(
            texto,
            tipo = "error"
        ) {

            mensagem.textContent = texto;

            mensagem.className =
                "form-message " + tipo;

            mensagem.style.display =
                "block";
        }


        // ==========================================
        // LOGIN
        // ==========================================

        formulario.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const senha =
                    senhaInput.value;


                reenviarArea.style.display =
                    "none";


                if (!email || !senha) {

                    mostrarMensagem(
                        "Digite seu e-mail e sua senha."
                    );

                    return;
                }


                botaoLogin.disabled =
                    true;

                botaoLogin.textContent =
                    "ENTRANDO...";


                try {

                    // ==================================
                    // 1. LOGIN NO FIREBASE
                    // ==================================

                    const resultado =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const usuario =
                        resultado.user;


                    // ==================================
                    // 2. ATUALIZA O USUÁRIO
                    // ==================================

                    await reload(usuario);


                    // ==================================
                    // 3. VERIFICA E-MAIL
                    // ==================================

                    if (!usuario.emailVerified) {

                        mostrarMensagem(
                            "Seu e-mail ainda não foi confirmado.\n\nVerifique sua caixa de entrada antes de entrar.",
                            "info"
                        );


                        reenviarArea.style.display =
                            "block";


                        return;
                    }


                    // ==================================
                    // 4. PEGA O TOKEN DO FIREBASE
                    // ==================================

                    const idToken =
                        await usuario.getIdToken(true);


                    console.log(
                        "Token Firebase obtido."
                    );


                    // ==================================
                    // 5. ENVIA TOKEN PARA O FLASK
                    // ==================================

                    const resposta =
                        await fetch(
                            "/firebase-login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    idToken: idToken
                                })
                            }
                        );


                    const dados =
                        await resposta.json();


                    console.log(
                        "Resposta do Flask:",
                        dados
                    );


                    // ==================================
                    // 6. FLASK ACEITOU O USUÁRIO
                    // ==================================

                    if (
                        resposta.ok &&
                        dados.success
                    ) {

                        mostrarMensagem(
                            "Login realizado com sucesso!",
                            "success"
                        );


                        // Aguarda um pouco
                        // e vai para a página inicial

                        setTimeout(() => {

                            window.location.href =
                                dados.redirect || "/";

                        }, 500);


                        return;
                    }


                    // ==================================
                    // FLASK RECUSOU
                    // ==================================

                    await signOut(auth);


                    mostrarMensagem(
                        dados.error ||
                        "Não foi possível criar a sessão no servidor."
                    );


                } catch (erro) {

                    console.error(
                        "ERRO NO LOGIN:",
                        erro
                    );


                    // ==================================
                    // E-MAIL NÃO ENCONTRADO
                    // ==================================

                    if (
                        erro.code ===
                        "auth/user-not-found"
                    ) {

                        mostrarMensagem(
                            "Não existe uma conta com esse e-mail."
                        );


                    // ==================================
                    // SENHA ERRADA
                    // ==================================

                    } else if (
                        erro.code ===
                        "auth/wrong-password"
                    ) {

                        mostrarMensagem(
                            "E-mail ou senha incorretos."
                        );


                    // ==================================
                    // CREDENCIAL INVÁLIDA
                    // ==================================

                    } else if (
                        erro.code ===
                        "auth/invalid-credential"
                    ) {

                        mostrarMensagem(
                            "E-mail ou senha incorretos."
                        );


                    // ==================================
                    // E-MAIL INVÁLIDO
                    // ==================================

                    } else if (
                        erro.code ===
                        "auth/invalid-email"
                    ) {

                        mostrarMensagem(
                            "Digite um e-mail válido."
                        );


                    // ==================================
                    // MUITAS TENTATIVAS
                    // ==================================

                    } else if (
                        erro.code ===
                        "auth/too-many-requests"
                    ) {

                        mostrarMensagem(
                            "Muitas tentativas. Aguarde alguns minutos e tente novamente."
                        );


                    // ==================================
                    // OUTRO ERRO
                    // ==================================

                    } else {

                        mostrarMensagem(
                            "Não foi possível entrar.\n\n" +
                            "Código: " +
                            erro.code +
                            "\n\n" +
                            erro.message
                        );

                    }

                } finally {

                    botaoLogin.disabled =
                        false;

                    botaoLogin.textContent =
                        "ENTRAR";

                }

            }
        );


        // ==========================================
        // REENVIAR E-MAIL
        // ==========================================

        botaoReenviar.addEventListener(
            "click",
            async () => {

                const usuario =
                    auth.currentUser;


                if (!usuario) {

                    mostrarMensagem(
                        "Faça login novamente para reenviar a confirmação."
                    );

                    return;
                }


                try {

                    botaoReenviar.disabled =
                        true;

                    botaoReenviar.textContent =
                        "ENVIANDO...";


                    await sendEmailVerification(
                        usuario
                    );


                    mostrarMensagem(
                        "E-mail de confirmação reenviado!\n\nVerifique sua caixa de entrada e a pasta de spam.",
                        "success"
                    );


                } catch (erro) {

                    console.error(
                        "ERRO AO REENVIAR:",
                        erro
                    );


                    mostrarMensagem(
                        "Não foi possível reenviar o e-mail.\n\n" +
                        "Código: " +
                        erro.code +
                        "\n\n" +
                        erro.message
                    );


                } finally {

                    botaoReenviar.disabled =
                        false;

                    botaoReenviar.textContent =
                        "Reenviar e-mail de confirmação";

                }

            }
        );

    </script>

</body>

</html>
